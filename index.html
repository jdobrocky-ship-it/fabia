<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Hlasová Evidencia Jázd</title>

    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* 1. CELOOBRAZOVKOVÉ SPÚŠŤACIE TLAČIDLO (OBRÁZOK) */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1e293b;
            background-image: url('plocha.jpg'); /* Obrázok zo rovnakej zložky */
            background-size: cover;
            background-position: center;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .splash-overlay {
            background: rgba(0, 0, 0, 0.4);
            padding: 20px 30px;
            border-radius: 16px;
            color: white;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .pulse-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* 2. CELOOBRAZOVKOVÝ NÁHĽAD (KARTA / "SCREENSHOT") */
        #previewScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            color: white;
            z-index: 2000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .preview-card {
            background: #1e293b;
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .preview-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #60a5fa;
            margin: 15px 0;
        }

        .preview-info {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-align: left;
        }

        /* HLAVNÉ ROZHRANIE APLIKÁCIE */
        .app-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .ride-item {
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
        }
    </style>
</head>
<body>

    <!-- 1. CELOOBRAZOVKOVÁ PLOCHA PRE HLASOVÉ ZADANIE -->
    <div id="splashScreen" onclick="startVoiceRecognition()">
        <div class="splash-overlay">
            <div class="pulse-icon">🎙️</div>
            <h2 style="margin:0;">Ťuknite kdekoľvek</h2>
            <p style="margin:5px 0 0 0; font-size:0.9rem;">a povedzte stav kilometrov</p>
            <p id="speechStatus" style="color: #fde047; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 2. OVEROVACÍ NÁHĽAD (POTVRDENIE ŤUKNUTÍM) -->
    <div id="previewScreen" onclick="confirmAndSave()">
        <div class="preview-card">
            <h2 style="margin-top:0; color:var(--success);">Nová jazda pripravená</h2>
            <p style="color:#cbd5e1; margin-bottom:0;">Rozpoznaný nový stav:</p>
            <div class="preview-value" id="prevKm">0 km</div>
            
            <div class="preview-info" id="prevDiff">Prejdené: 0 km</div>
            <div class="preview-info" id="prevGps">GPS: Získavam...</div>
            <div class="preview-info" id="prevAddress">Adresa: Načítavam...</div>

            <div style="margin-top: 25px; background: var(--success); color: white; padding: 12px; border-radius: 8px; font-weight: bold;">
                Ťuknite KDEKOĽVEK pre uloženie
            </div>
        </div>
    </div>

    <!-- HLAVNÝ PREHĽAD APLIKÁCIE -->
    <div class="app-container">
        <h1 style="text-align: center;">Evidencia Jázd</h1>

        <div class="card">
            <button class="btn" onclick="showSplashScreen()">Otvoriť hlasové zadávanie</button>
        </div>

        <div class="card">
            <h2>Posledné jazdy</h2>
            <div id="ridesList">Načítavam jazdy...</div>
        </div>
    </div>

<script>
let db;
let currentCoords = { lat: null, lon: null, accuracy: null };
let fetchedAddress = "";
let pendingRide = null;

// --- INDEXED DB ---
const dbRequest = indexedDB.open("KninaJazdDB", 1);
dbRequest.onupgradeneeded = function(e) {
    db = e.target.result;
    if (!db.objectStoreNames.contains("rides")) {
        const store = db.createObjectStore("rides", { keyPath: "id", autoIncrement: true });
        store.createIndex("datetime", "datetime", { unique: false });
    }
};
dbRequest.onsuccess = function(e) {
    db = e.target.result;
    loadRidesList();
    getGeolocation();
};

// --- GEOLOKÁCIA & NOMINATIM ---
function getGeolocation() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            currentCoords.lat = pos.coords.latitude.toFixed(6);
            currentCoords.lon = pos.coords.longitude.toFixed(6);
            currentCoords.accuracy = Math.round(pos.coords.accuracy);

            if (navigator.onLine) {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentCoords.lat}&lon=${currentCoords.lon}`);
                    const data = await res.json();
                    fetchedAddress = data.display_name || "";
                } catch(e) { fetchedAddress = ""; }
            }
        },
        (err) => {},
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

// --- HLASOVÉ ROZPOZNÁVANIE (WEB SPEECH API) ---
function startVoiceRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const statusText = document.getElementById('speechStatus');

    if (!SpeechRecognition) {
        alert("Váš prehliadač nepodporuje hlasové zadávanie.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'sk-SK'; // Slovenský jazyk
    recognition.interimResults = false;

    statusText.innerText = "Počúvam... Hovorte km";

    recognition.start();

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        statusText.innerText = `Počul som: "${transcript}"`;
        
        // Extrakcia čísla z hovoreného textu (napr. "sto tisíc päťsto" alebo "120500")
        const extractedNumber = parseSpeechToNumber(transcript);

        if (extractedNumber && !isNaN(extractedNumber)) {
            processVoiceKm(extractedNumber);
        } else {
            alert(`Nepodarilo sa rozpoznať číslo z textu: "${transcript}". Skúste znova.`);
            statusText.innerText = "";
        }
    };

    recognition.onerror = function(event) {
        statusText.innerText = "Chyba rozpoznávania. Skúste znova.";
    };
}

// Konverzia textu/reči na čisté číslo
function parseSpeechToNumber(text) {
    // Odstránenie všetkých znakov okrem číslic
    const digitsOnly = text.replace(/\D/g, '');
    if (digitsOnly.length > 0) {
        return parseInt(digitsOnly, 10);
    }
    return null;
}

// --- SPRACOVANIE ZADANÝCH KM & ZOBRAZENIE OVERENIA ---
function processVoiceKm(newKm) {
    const tx = db.transaction("rides", "readonly");
    const store = tx.objectStore("rides");
    const req = store.openCursor(null, 'prev');

    req.onsuccess = function(e) {
        const cursor = e.target.result;
        const lastOdo = cursor ? cursor.value.currentOdo : 0;

        if (newKm <= lastOdo) {
            alert(`Nový stav (${newKm} km) musí byť väčší ako posledný stav (${lastOdo} km)!`);
            document.getElementById('speechStatus').innerText = "";
            return;
        }

        const distance = newKm - lastOdo;
        const nowIso = new Date().toISOString().slice(0, 16);

        // Uloženie do dočasného objektu
        pendingRide = {
            datetime: nowIso,
            lastOdo: lastOdo,
            currentOdo: newKm,
            distance: distance,
            destination: "Hlasový zápis",
            lat: currentCoords.lat,
            lon: currentCoords.lon,
            accuracy: currentCoords.accuracy,
            address: fetchedAddress
        };

        // Naplnenie náhľadu
        document.getElementById('prevKm').innerText = `${newKm} km`;
        document.getElementById('prevDiff').innerText = `Pôvodný stav: ${lastOdo} km (+${distance} km)`;
        document.getElementById('prevGps').innerText = `GPS: ${currentCoords.lat || 'Neznáme'}, ${currentCoords.lon || ''}`;
        document.getElementById('prevAddress').innerText = `Adresa: ${fetchedAddress || 'Offline / Nedostupná'}`;

        // Schovanie úvodnej obrazovky a zobrazenie náhľadu
        document.getElementById('splashScreen').style.display = 'none';
        document.getElementById('previewScreen').style.display = 'flex';
    };
}

// --- POTVRDENIE A ULOŽENIE ---
function confirmAndSave() {
    if (!pendingRide) return;

    const tx = db.transaction("rides", "readwrite");
    const store = tx.objectStore("rides");
    store.add(pendingRide);

    tx.oncomplete = function() {
        alert("Jazda bola úspešne uložená!");
        pendingRide = null;
        document.getElementById('previewScreen').style.display = 'none';
        document.getElementById('speechStatus').innerText = "";
        loadRidesList();
    };
}

function showSplashScreen() {
    document.getElementById('splashScreen').style.display = 'flex';
}

// --- NAČÍTANIE ZOZNAMU JÁZD ---
function loadRidesList() {
    const listDiv = document.getElementById('ridesList');
    listDiv.innerHTML = '';

    const tx = db.transaction("rides", "readonly");
    const store = tx.objectStore("rides");
    const req = store.openCursor(null, 'prev');

    let count = 0;
    req.onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor && count < 10) {
            const r = cursor.value;
            const item = document.createElement('div');
            item.className = 'ride-item';
            item.innerHTML = `
                <div><strong>${new Date(r.datetime).toLocaleString('sk-SK')}</strong> — <span style="color:var(--primary); font-weight:bold;">+${r.distance} km</span></div>
                <div style="font-size:0.85rem; color:#64748b;">Stav: ${r.lastOdo} ➔ ${r.currentOdo} km | ${r.address || 'Bez adresy'}</div>
            `;
            listDiv.appendChild(item);
            count++;
            cursor.continue();
        } else if (count === 0) {
            listDiv.innerHTML = '<p style="text-align:center; color:#64748b;">Žiadne záznamy</p>';
        }
    };
}
</script>
</body>
</html>
